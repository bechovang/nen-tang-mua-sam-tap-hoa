spring:
  application:
    name: taphoagan
  profiles:
    default: local
    group:
      prod: pilot
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

server:
  port: 8080
  forward-headers-strategy: framework

payos:
  enabled: ${PAYOS_ENABLED:false}
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  barcode-lookup-url: ${BARCODE_LOOKUP_URL:https://world.openfoodfacts.org/api/v2/product}
  barcode-timeout-ms: ${BARCODE_TIMEOUT_MS:3000}
  pickup-hold-hours: ${PICKUP_HOLD_HOURS:2}
  seed: false
  demo-seed: ${DEMO_SEED:false}
  mail:
    enabled: ${MAIL_ENABLED:true}
  s3:
    enabled: ${S3_ENABLED:false}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:taphoa}
    region: ${S3_REGION:us-east-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
