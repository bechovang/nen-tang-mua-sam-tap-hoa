spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/taphoa}
    username: ${DB_USER:taphoa}
    password: ${DB_PASSWORD:taphoa}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

app:
  seed: true
  s3:
    enabled: true
    endpoint: http://localhost:9090
    access-key: foo
    secret-key: bar
    bucket: taphoa

logging:
  level:
    vn.taphoagan: INFO
