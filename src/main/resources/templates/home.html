<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nhà')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="main-wrap">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div th:if="${lat == null}" class="card-soft">
        <h1 class="h4 mb-1">Tiệm quanh nhà bạn</h1>
        <p class="text-muted-2 mb-3">Chọn vị trí để xem tiệm gần, giá và tình trạng còn hàng.</p>
        <form id="locationForm" th:action="@{/location}" method="post">
            <input type="hidden" name="lat" id="lat">
            <input type="hidden" name="lng" id="lng">
            <button type="button" id="useLocation" class="btn btn-primary w-100">Dùng vị trí của tôi</button>
            <div class="hr-soft"></div>
            <label for="wardId" class="form-label">Hoặc chọn phường</label>
            <select name="wardId" id="wardId" class="form-select">
                <option value="">Chọn phường trong khu vực pilot</option>
                <option th:each="w : ${wards}" th:value="${w.id}" th:text="${w.name}"></option>
            </select>
            <button type="submit" class="btn btn-outline-primary w-100 mt-2">Xem tiệm theo phường</button>
        </form>
    </div>

    <div th:if="${lat != null}">
        <div class="d-flex align-items-start justify-content-between mb-3">
            <div>
                <div class="small-caps">Đang xem quanh</div>
                <strong th:text="${session.wardName != null ? session.wardName : 'Vị trí hiện tại'}">Vị trí hiện tại</strong>
            </div>
            <a th:href="@{/location/reset}" class="btn btn-sm btn-outline-primary">Đổi vị trí</a>
        </div>

        <div th:if="${stores != null and !stores.isEmpty()}">
            <a th:each="s : ${stores}" th:href="@{/stores/{slug}(slug=${s.store.slug})}" class="store-card mb-3">
                <div class="d-flex justify-content-between align-items-start gap-2">
                    <h3 th:text="${s.store.name}">Tên tiệm</h3>
                    <span class="status-chip status-completed"
                          th:text="${s.store.status.name() == 'OPEN' ? 'Đang mở' : 'Đang đóng'}">Đang mở</span>
                </div>
                <div class="text-muted-2 small" th:text="${s.store.address}">Địa chỉ</div>
                <div class="d-flex flex-wrap gap-2 mt-2">
                    <span class="badge-soft" th:text="${distanceFormatter.formatDistance(s.distanceKm)}">0 km</span>
                    <span class="badge-soft" th:if="${s.store.deliveryEnabled}">Giao hàng</span>
                    <span class="badge-soft" th:if="${s.store.pickupEnabled}">Nhận tại tiệm</span>
                    <span class="badge-soft" th:text="${s.itemCount} + ' món'">0 món</span>
                </div>
            </a>
        </div>

        <div th:if="${stores == null or stores.isEmpty()}" class="empty-state">
            <div class="icon">⌂</div>
            <p>Chưa có tiệm nào trong bán kính này.</p>
            <a th:href="@{/search}" class="btn btn-outline-primary">Tìm tiệm hoặc món</a>
        </div>
    </div>
</main>
<nav th:replace="~{fragments/layout :: customerNav}"></nav>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
    document.getElementById('useLocation')?.addEventListener('click', () => {
        if (!navigator.geolocation) {
            alert('Trình duyệt không hỗ trợ vị trí. Bạn chọn phường giúp tiệm nhé.');
            return;
        }
        navigator.geolocation.getCurrentPosition(position => {
            document.getElementById('lat').value = position.coords.latitude;
            document.getElementById('lng').value = position.coords.longitude;
            document.getElementById('locationForm').submit();
        }, () => alert('Không lấy được vị trí. Bạn chọn phường giúp tiệm nhé.'));
    });
</script>
</body>
</html>
