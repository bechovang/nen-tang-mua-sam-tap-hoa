<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đơn ' + ${order.code})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="main-wrap">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card-soft mb-3">
        <div class="d-flex justify-content-between align-items-start gap-2">
            <div>
                <div class="small-caps">Mã đơn</div>
                <h1 class="h4 mb-1" th:text="${order.code}">TH-000000-0000</h1>
                <div class="text-muted-2 small" th:text="${format.dateTime(order.createdAt)}">Thời gian</div>
            </div>
            <span class="status-chip"
                  th:classappend="${'status-' + #strings.toLowerCase(order.status.name())}"
                  th:text="${order.status.label()}">Trạng thái</span>
        </div>
        <div class="hr-soft"></div>
        <div class="d-flex justify-content-between">
            <span th:text="${order.fulfillment.name() == 'DELIVERY' ? 'Giao hàng' : 'Nhận tại tiệm'}">Hình thức</span>
            <strong th:text="${format.money(order.total)}">0 ₫</strong>
        </div>
        <div th:if="${order.fulfillment.name() == 'DELIVERY'}" class="small text-muted-2 mt-1" th:text="${order.deliveryAddress}">Địa chỉ</div>
        <div th:if="${order.fulfillment.name() == 'PICKUP'}" class="small text-muted-2 mt-1">
            Giờ hẹn: <span th:text="${format.time(order.pickupStart) + ' – ' + format.time(order.pickupEnd)}">18:30</span>
            · Giữ tới <span th:text="${format.time(order.holdUntil)}">21:00</span>
        </div>
    </div>

    <div class="card-soft mb-3">
        <h2 class="h6 mb-3">Món trong đơn</h2>
        <div th:each="item : ${items}" class="d-flex justify-content-between border-bottom py-2">
            <div>
                <div th:text="${item.nameSnapshot}">Món</div>
                <div class="small text-muted-2">
                    <span th:text="${item.quantity} + ' × ' + ${format.money(item.unitPriceSnapshot)}">1 × 0 ₫</span>
                </div>
            </div>
            <strong th:text="${format.money(item.quantity * item.unitPriceSnapshot)}">0 ₫</strong>
        </div>
        <div class="d-flex justify-content-between mt-3"><span>Tạm tính</span><span th:text="${format.money(order.subtotal)}">0 ₫</span></div>
        <div class="d-flex justify-content-between"><span>Phí giao</span><span th:text="${format.money(order.deliveryFee)}">0 ₫</span></div>
        <div class="d-flex justify-content-between mt-2"><strong>Tổng</strong><strong class="price" th:text="${format.money(order.total)}">0 ₫</strong></div>
    </div>

    <div class="card-soft mb-3">
        <h2 class="h6 mb-3">Dòng thời gian</h2>
        <ul class="timeline">
            <li th:each="e : ${events}">
                <div class="fw-semibold" th:text="${e.toStatus.label()}">Trạng thái</div>
                <div class="small text-muted-2" th:text="${format.dateTime(e.createdAt) + (e.note != null ? ' · ' + e.note : '')}">Thời gian</div>
            </li>
        </ul>
    </div>

    <div class="d-flex gap-2">
        <form th:if="${order.status.name() == 'PENDING' or order.status.name() == 'CONFIRMED'}"
              th:action="@{/orders/{code}/cancel(code=${order.code})}" method="post">
            <button class="btn btn-outline-danger" type="submit">Hủy đơn</button>
        </form>
        <form th:if="${order.status.name() == 'COMPLETED' or order.status.name() == 'CANCELLED'}"
              th:action="@{/orders/{code}/reorder(code=${order.code})}" method="post">
            <button class="btn btn-primary" type="submit">Đặt lại</button>
        </form>
    </div>
</main>
<nav th:replace="~{fragments/layout :: customerNav}"></nav>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
