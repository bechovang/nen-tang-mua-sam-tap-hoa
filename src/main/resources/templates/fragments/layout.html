<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title th:text="${title} + ' · ' + ${appName}">Tạp Hóa Gần</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/leaflet.css}">
    <link rel="stylesheet" th:href="@{/css/app.css(v='20261105-1')}">
</head>
<body>

<header class="app-header" th:fragment="header">
    <div class="inner">
        <a class="brand" th:href="@{/}">Tạp Hóa <span class="brand-dot">Gần</span></a>
        <nav class="desktop-nav" aria-label="Điều hướng chính">
            <a th:href="@{/browse}" th:classappend="${currentPath == '/browse' or currentPath == '/search' ? 'active' : ''}">Khám phá</a>
            <a th:href="@{/cart}" th:classappend="${currentPath == '/cart' ? 'active' : ''}">Giỏ</a>
            <a th:href="@{/orders}" th:classappend="${#strings.startsWith(currentPath, '/orders') ? 'active' : ''}">Đơn</a>
        </nav>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a th:if="${hasStore}" th:href="@{/store}" class="btn btn-sm btn-outline-primary">Kênh bán</a>
            <a th:if="${currentUser != null and !hasStore}" th:href="@{/store/profile}" class="btn btn-sm btn-outline-primary">Mở cửa hàng</a>
            <a th:if="${currentUser == null}" th:href="@{/login}" class="btn btn-sm btn-primary">Đăng nhập</a>
            <div th:if="${currentUser != null}" class="dropdown">
                <button class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" type="button">
                    <span th:text="${currentUser.name != null ? currentUser.name : currentUser.email}">Tài khoản</span>
                    <span th:if="${unreadCount > 0}" class="badge text-bg-warning" th:text="${unreadCount}">0</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" th:href="@{/notifications}">Thông báo
                        <span th:if="${unreadCount > 0}" class="badge text-bg-warning" th:text="${unreadCount}">0</span>
                    </a></li>
                    <li><a class="dropdown-item" th:href="@{/orders}">Đơn của tôi</a></li>
                    <li th:if="${hasStore}"><a class="dropdown-item" th:href="@{/store}">Quản lý tiệm</a></li>
                    <li th:if="${!hasStore}"><a class="dropdown-item" th:href="@{/store/profile}">Mở cửa hàng</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form th:action="@{/logout}" method="post" class="px-3 py-1">
                            <button class="btn btn-sm btn-outline-danger w-100" type="submit">Đăng xuất</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</header>

<div th:fragment="flash">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
</div>

<nav class="bottom-nav customer-nav" th:fragment="customerNav">
    <div class="inner">
        <a th:href="@{/}" th:classappend="${currentPath == '/' ? 'active' : ''}">
            <span class="nav-icon">⌂</span><span>Nhà</span>
        </a>
        <a th:href="@{/browse}" th:classappend="${currentPath == '/browse' or currentPath == '/search' ? 'active' : ''}">
            <span class="nav-icon">⌕</span><span>Khám phá</span>
        </a>
        <a th:href="@{/cart}" th:classappend="${currentPath == '/cart' ? 'active' : ''}">
            <span class="nav-icon">▤</span><span>Giỏ</span>
            <span th:if="${cartCount > 0}" class="nav-badge" th:text="${cartCount}">0</span>
        </a>
        <a th:href="@{/orders}" th:classappend="${#strings.startsWith(currentPath, '/orders') ? 'active' : ''}">
            <span class="nav-icon">≡</span><span>Đơn</span>
        </a>
    </div>
</nav>

<nav class="bottom-nav store-nav" th:fragment="storeNav">
    <div class="inner">
        <a th:href="@{/store/orders}" th:classappend="${#strings.startsWith(currentPath, '/store/orders') ? 'active' : ''}">
            <span class="nav-icon">≡</span><span>Đơn</span>
        </a>
        <a th:href="@{/store/catalog}" th:classappend="${#strings.startsWith(currentPath, '/store/catalog') ? 'active' : ''}">
            <span class="nav-icon">▤</span><span>Danh mục</span>
        </a>
        <a th:href="@{/store/scan}" class="scan-center" th:classappend="${#strings.startsWith(currentPath, '/store/scan') ? 'active' : ''}">
            <span class="nav-icon">◎</span><span>Quét</span>
        </a>
        <a th:href="@{/pos}" th:classappend="${#strings.startsWith(currentPath, '/pos') ? 'active' : ''}">
            <span class="nav-icon">₫</span><span>Bán</span>
        </a>
        <a th:href="@{/store}" th:classappend="${currentPath == '/store' or #strings.startsWith(currentPath, '/store/profile') ? 'active' : ''}">
            <span class="nav-icon">⌂</span><span>Tiệm</span>
        </a>
    </div>
</nav>

<div th:fragment="scripts">
    <script th:src="@{/vendor/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/leaflet.js}"></script>
    <script th:src="@{/vendor/zxing-browser.min.js}"></script>
    <script th:src="@{/js/app.js(v='20261105-3')}"></script>
    <script th:src="@{/js/scanner.js(v='20261105-1')}"></script>
</div>

</body>
</html>
