<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Kênh bán')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="store-wrap">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="d-flex justify-content-between align-items-start gap-2 mb-3">
        <div>
            <div class="small-caps">Kênh bán</div>
            <h1 class="h4 mb-1" th:text="${store.name}">Tên tiệm</h1>
            <div class="text-muted-2 small" th:text="${store.address}">Địa chỉ</div>
        </div>
        <form th:action="@{/store/status}" method="post">
            <input type="hidden" name="status" th:value="${store.status.name() == 'OPEN' ? 'CLOSED' : 'OPEN'}">
            <button class="btn btn-sm" th:classappend="${store.status.name() == 'OPEN' ? 'btn-outline-danger' : 'btn-primary'}"
                    th:text="${store.status.name() == 'OPEN' ? 'Tạm đóng' : 'Mở tiệm'}">Tạm đóng</button>
        </form>
    </div>

    <div class="row g-2 mb-3">
        <div class="col-6 col-md-3"><div class="stat"><div class="small-caps">Món đang bán</div><div class="value" th:text="${productCount}">0</div></div></div>
        <div class="col-6 col-md-3"><div class="stat"><div class="small-caps">Đơn chờ</div><div class="value" th:text="${pendingCount}">0</div></div></div>
    </div>

    <div class="d-grid gap-2 mb-3">
        <a th:href="@{/store/orders}" class="btn btn-primary">Xem đơn của tiệm</a>
        <a th:href="@{/store/scan}" class="btn btn-outline-primary">Quét thêm món</a>
        <a th:href="@{/pos}" class="btn btn-outline-primary">Bán tại quầy</a>
        <a th:href="@{/store/profile}" class="btn btn-outline-secondary">Sửa hồ sơ tiệm</a>
    </div>

    <h2 class="h6">Đơn gần đây</h2>
    <div th:if="${recentOrders.isEmpty()}" class="text-muted-2 small">Đơn mới sẽ xuất hiện ở đây.</div>
    <a th:each="o : ${recentOrders}" th:href="@{/store/orders/{code}(code=${o.code})}" class="store-card mb-2">
        <div class="d-flex justify-content-between">
            <div>
                <div class="fw-semibold" th:text="${o.code}">Mã đơn</div>
                <div class="small text-muted-2" th:text="${format.dateTime(o.createdAt)}">Thời gian</div>
            </div>
            <span class="status-chip" th:classappend="${'status-' + #strings.toLowerCase(o.status.name())}" th:text="${o.status.label()}">Trạng thái</span>
        </div>
    </a>
</main>
<nav th:replace="~{fragments/layout :: storeNav}"></nav>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
