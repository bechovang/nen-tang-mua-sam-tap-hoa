<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Danh mục')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="store-wrap">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
        <div>
            <div class="small-caps">Danh mục</div>
            <h1 class="h4 mb-0" th:text="${store.name}">Tiệm</h1>
        </div>
        <a th:href="@{/store/scan}" class="btn btn-primary">Quét thêm</a>
    </div>

    <form method="get" th:action="@{/store/catalog}" class="d-flex gap-2 mb-3">
        <input class="form-control" type="search" name="q" th:value="${q}" placeholder="Tìm theo tên hoặc mã vạch">
        <button class="btn btn-outline-primary" type="submit">Tìm</button>
    </form>

    <div th:if="${products.isEmpty()}" class="empty-state">
        <div class="icon">▤</div>
        <p>Chưa có mặt hàng nào.</p>
        <a th:href="@{/store/scan}" class="btn btn-primary">Quét món đầu tiên</a>
    </div>

    <div class="d-grid gap-2">
        <div th:each="p : ${products}" class="card-soft">
            <form th:action="@{/store/catalog/{id}(id=${p.id})}" method="post" enctype="multipart/form-data">
                <div class="row g-2 align-items-end">
                    <div class="col-12 col-md-4">
                        <label class="form-label small">Tên</label>
                        <input class="form-control" name="name" th:value="${p.name}" required>
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label small">Giá</label>
                        <input class="form-control" name="price" type="number" min="1" th:value="${p.price}" required>
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label small">Đơn vị</label>
                        <input class="form-control" name="unit" th:value="${p.unit}" required>
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label small">Tồn</label>
                        <input class="form-control" name="stock" type="number" min="0" th:value="${p.stock}" required>
                    </div>
                    <div class="col-6 col-md-2">
                        <input type="hidden" name="barcode" th:value="${p.barcode}">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="active" th:checked="${p.active}" id="active-${p.id}">
                            <label class="form-check-label small" th:for="'active-' + ${p.id}">Còn bán</label>
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-label small">Ảnh (tùy chọn, tối đa 2 MB)</label>
                        <input class="form-control form-control-sm" type="file" name="image"
                               accept="image/jpeg,image/png,image/webp">
                    </div>
                    <div class="col-12 d-flex gap-2">
                        <button class="btn btn-sm btn-primary" type="submit">Lưu</button>
                    </div>
                </div>
            </form>
            <div class="d-flex gap-2 mt-2">
                <form th:action="@{/store/catalog/{id}/toggle(id=${p.id})}" method="post">
                    <button class="btn btn-sm btn-outline-secondary" type="submit" th:text="${p.active ? 'Tạm ẩn' : 'Bán lại'}">Tạm ẩn</button>
                </form>
                <form th:action="@{/store/catalog/{id}/delete(id=${p.id})}" method="post"
                      onsubmit="return confirm('Xóa mặt hàng này khỏi danh mục bán?')">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
                </form>
                <span class="small text-muted-2 ms-auto">Mã: <span th:text="${p.barcode}">000</span></span>
            </div>
        </div>
    </div>
</main>
<nav th:replace="~{fragments/layout :: storeNav}"></nav>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
