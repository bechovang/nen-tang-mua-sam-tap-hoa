<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Biên nhận')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="store-wrap" style="max-width:560px">
    <div class="card-soft">
        <div class="text-center mb-3">
            <div class="small-caps">Tạp Hóa Gần</div>
            <h1 class="h5">Biên nhận bán hàng</h1>
            <div class="small text-muted-2" th:text="${order.code}">POS-000000-0000</div>
            <div class="small text-muted-2" th:text="${format.dateTime(order.createdAt)}">Thời gian</div>
        </div>
        <div th:each="item : ${items}" class="d-flex justify-content-between border-bottom py-2">
            <div>
                <div th:text="${item.nameSnapshot}">Món</div>
                <div class="small text-muted-2" th:text="${item.quantity} + ' × ' + ${format.money(item.unitPriceSnapshot)}">1 × 0 ₫</div>
            </div>
            <strong th:text="${format.money(item.quantity * item.unitPriceSnapshot)}">0 ₫</strong>
        </div>
        <div class="d-flex justify-content-between mt-3"><strong>Tổng</strong><strong class="price" th:text="${format.money(order.total)}">0 ₫</strong></div>
        <div class="d-flex justify-content-between"><span>Thanh toán</span><span>Tiền mặt</span></div>
        <div class="alert alert-success mt-3 mb-0">Đã thu tiền và hoàn tất đơn.</div>
        <div class="d-grid gap-2 mt-3">
            <a th:href="@{/pos}" class="btn btn-primary">Bán đơn mới</a>
            <a th:href="@{/store}" class="btn btn-outline-secondary">Về tiệm</a>
        </div>
    </div>
</main>
<nav th:replace="~{fragments/layout :: storeNav}"></nav>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
