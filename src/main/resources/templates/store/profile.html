<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Hồ sơ tiệm')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="store-wrap">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h4 mb-1" th:text="${store == null ? 'Mở cửa hàng' : 'Hồ sơ tiệm'}">Hồ sơ tiệm</h1>
    <p class="text-muted-2" th:text="${store == null ? 'Điền thông tin tiệm để bắt đầu đăng bán. Bạn có thể cập nhật sau.' : 'Thông tin này quyết định khách nào thấy tiệm và có thể giao hàng hay không.'}">Thông tin này quyết định khách nào thấy tiệm và có thể giao hàng hay không.</p>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/store/profile}" th:object="${storeForm}" method="post" class="card-soft">
        <div class="row g-3">
            <div class="col-12">
                <label class="form-label" for="name">Tên tiệm</label>
                <input class="form-control" id="name" th:field="*{name}" placeholder="Tạp hóa Chị Lan">
                <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <div class="col-12">
                <label class="form-label" for="address">Địa chỉ</label>
                <input class="form-control" id="address" th:field="*{address}" placeholder="Số nhà, đường, phường">
                <div class="text-danger small" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
            </div>
            <div class="col-12">
                <label class="form-label" for="wardId">Phường</label>
                <select class="form-select" id="wardId" th:field="*{wardId}">
                    <option value="">Chọn phường</option>
                    <option th:each="w : ${wards}" th:value="${w.id}" th:text="${w.name}"></option>
                </select>
            </div>
            <div class="col-12">
                <label class="form-label">Ghim vị trí tiệm</label>
                <div id="map" class="map-picker"></div>
                <div class="row g-2 mt-2">
                    <div class="col-6">
                        <label class="form-label" for="lat">Vĩ độ</label>
                        <input class="form-control" id="lat" th:field="*{lat}" readonly>
                    </div>
                    <div class="col-6">
                        <label class="form-label" for="lng">Kinh độ</label>
                        <input class="form-control" id="lng" th:field="*{lng}" readonly>
                    </div>
                </div>
                <div class="form-text">Chạm trên bản đồ để đặt vị trí tiệm, hoặc dùng nút bên dưới.</div>
                <button type="button" id="currentLocation" class="btn btn-sm btn-outline-primary mt-2">Dùng vị trí hiện tại</button>
                <div id="geoStatus" class="form-text" role="status"></div>
            </div>
            <div class="col-12 col-md-6">
                <label class="form-label" for="phone">Số điện thoại</label>
                <input class="form-control" id="phone" th:field="*{phone}" placeholder="09...">
                <div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label" for="radiusKm">Bán kính (km)</label>
                <input class="form-control" id="radiusKm" th:field="*{radiusKm}" type="number" step="0.5" min="0.5" max="5">
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label" for="deliveryFee">Phí giao (₫)</label>
                <input class="form-control" id="deliveryFee" th:field="*{deliveryFee}" type="number" min="0" step="1000">
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label" for="minOrder">Đơn tối thiểu (₫)</label>
                <input class="form-control" id="minOrder" th:field="*{minOrder}" type="number" min="0" step="1000">
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label" for="openTime">Giờ mở</label>
                <input class="form-control" id="openTime" type="time" step="60" required>
                <input type="hidden" id="openMinute" th:field="*{openMinute}">
                <div class="text-danger small" th:if="${#fields.hasErrors('openMinute')}" th:errors="*{openMinute}"></div>
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label" for="closeTime">Giờ đóng</label>
                <input class="form-control" id="closeTime" type="time" step="60" required>
                <input type="hidden" id="closeMinute" th:field="*{closeMinute}">
                <div class="text-danger small" th:if="${#fields.hasErrors('closeMinute')}" th:errors="*{closeMinute}"></div>
            </div>
            <div class="col-12">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="deliveryEnabled" th:field="*{deliveryEnabled}">
                    <label class="form-check-label" for="deliveryEnabled">Nhận giao hàng</label>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="pickupEnabled" th:field="*{pickupEnabled}">
                    <label class="form-check-label" for="pickupEnabled">Nhận khách đến lấy</label>
                </div>
            </div>
        </div>
        <button class="btn btn-primary w-100 mt-3" type="submit"
                th:text="${store == null ? 'Mở cửa hàng' : 'Lưu hồ sơ'}">Lưu hồ sơ</button>
    </form>
</main>
<nav th:if="${store != null}" th:replace="~{fragments/layout :: storeNav}"></nav>
<nav th:if="${store == null}" th:replace="~{fragments/layout :: customerNav}"></nav>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
    const latInput = document.getElementById('lat');
    const lngInput = document.getElementById('lng');
    const map = L.map('map').setView([latInput.value || 10.776, lngInput.value || 106.700], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);
    let marker = null;
    function setPoint(lat, lng) {
        latInput.value = lat.toFixed(6);
        lngInput.value = lng.toFixed(6);
        if (marker) marker.setLatLng([lat, lng]);
        else marker = L.marker([lat, lng]).addTo(map);
    }
    if (latInput.value && lngInput.value) setPoint(Number(latInput.value), Number(lngInput.value));
    map.on('click', event => setPoint(event.latlng.lat, event.latlng.lng));

    const openMinuteInput = document.getElementById('openMinute');
    const closeMinuteInput = document.getElementById('closeMinute');
    const openTimeInput = document.getElementById('openTime');
    const closeTimeInput = document.getElementById('closeTime');

    function minuteToTime(value) {
        const minute = Number(value);
        if (!Number.isFinite(minute) || minute < 0) return '';
        return String(Math.floor(minute / 60)).padStart(2, '0') + ':' + String(minute % 60).padStart(2, '0');
    }
    function timeToMinute(value) {
        if (!value || !value.includes(':')) return '';
        const [hour, minute] = value.split(':').map(Number);
        if (!Number.isFinite(hour) || !Number.isFinite(minute)) return '';
        return String(hour * 60 + minute);
    }
    if (openMinuteInput && openTimeInput) openTimeInput.value = minuteToTime(openMinuteInput.value);
    if (closeMinuteInput && closeTimeInput) closeTimeInput.value = minuteToTime(closeMinuteInput.value);
    openTimeInput?.addEventListener('input', () => openMinuteInput.value = timeToMinute(openTimeInput.value));
    closeTimeInput?.addEventListener('input', () => closeMinuteInput.value = timeToMinute(closeTimeInput.value));

    const geoStatus = document.getElementById('geoStatus');
    document.getElementById('currentLocation')?.addEventListener('click', () => {
        if (!window.isSecureContext) {
            geoStatus.textContent = 'Trình duyệt chỉ cho lấy vị trí trên HTTPS hoặc localhost. Hãy mở trang bằng HTTPS.';
            return;
        }
        if (!navigator.geolocation) {
            geoStatus.textContent = 'Trình duyệt không hỗ trợ lấy vị trí. Chạm trên bản đồ để chọn.';
            return;
        }
        geoStatus.textContent = 'Đang lấy vị trí...';
        navigator.geolocation.getCurrentPosition(position => {
            const {latitude, longitude} = position.coords;
            map.setView([latitude, longitude], 16);
            setPoint(latitude, longitude);
            geoStatus.textContent = 'Đã lấy vị trí. Kiểm tra điểm ghim trên bản đồ rồi lưu hồ sơ.';
        }, error => {
            if (error.code === error.PERMISSION_DENIED) {
                geoStatus.textContent = 'Bạn đã chặn quyền vị trí. Hãy bật lại trong cài đặt trình duyệt hoặc chạm bản đồ để chọn.';
            } else if (error.code === error.TIMEOUT) {
                geoStatus.textContent = 'Lấy vị trí quá lâu. Thử lại hoặc chạm bản đồ để chọn.';
            } else {
                geoStatus.textContent = 'Không lấy được vị trí. Chạm trên bản đồ để chọn.';
            }
        }, {enableHighAccuracy: true, timeout: 10000, maximumAge: 60000});
    });
</script>
</body>
</html>
