<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đơn của tiệm')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="store-wrap">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Đơn của tiệm</h1>
        <span class="badge-soft" th:text="${orders.size()} + ' đơn'">0 đơn</span>
    </div>

    <div th:if="${orders.isEmpty()}" class="empty-state">
        <div class="icon">☷</div>
        <p>Chưa có đơn nào.</p>
        <p class="small">Đơn mới sẽ xuất hiện ở đây.</p>
    </div>

    <a th:each="o : ${orders}" th:href="@{/store/orders/{code}(code=${o.code})}" class="store-card mb-2">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <div class="fw-semibold" th:text="${o.code}">Mã đơn</div>
                <div class="small text-muted-2" th:text="${format.dateTime(o.createdAt)} + ' · ' + ${o.phone}">Thời gian</div>
            </div>
            <span class="status-chip" th:classappend="${'status-' + #strings.toLowerCase(o.status.name())}" th:text="${o.status.label()}">Trạng thái</span>
        </div>
        <div class="d-flex justify-content-between mt-2">
            <span class="small text-muted-2" th:text="${o.fulfillment.name() == 'DELIVERY' ? 'Giao hàng' : 'Nhận tại tiệm'}">Hình thức</span>
            <strong class="price" th:text="${format.money(o.total)}">0 ₫</strong>
        </div>
    </a>
</main>
<nav th:replace="~{fragments/layout :: storeNav}"></nav>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
