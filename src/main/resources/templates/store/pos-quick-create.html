<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tạo nhanh món')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="store-wrap" style="max-width:560px">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h4 mb-2">Mã chưa có trong tiệm</h1>
    <p class="text-muted-2">Tạo nhanh món để thêm vào hóa đơn.</p>

    <form th:action="@{/pos/quick-create}" th:object="${quickCreateForm}" method="post" class="card-soft">
        <div class="mb-2">
            <label class="form-label" for="barcode">Mã vạch</label>
            <input class="form-control" id="barcode" th:field="*{barcode}" readonly>
        </div>
        <div class="mb-2">
            <label class="form-label" for="name">Tên món</label>
            <input class="form-control" id="name" th:field="*{name}" required>
        </div>
        <div class="row g-2">
            <div class="col-6">
                <label class="form-label" for="price">Giá</label>
                <input class="form-control" id="price" type="number" min="1" th:field="*{price}" required>
            </div>
            <div class="col-6">
                <label class="form-label" for="unit">Đơn vị</label>
                <input class="form-control" id="unit" th:field="*{unit}">
            </div>
            <div class="col-6">
                <label class="form-label" for="stock">Tồn kho</label>
                <input class="form-control" id="stock" type="number" min="0" th:field="*{stock}">
            </div>
        </div>
        <button class="btn btn-primary w-100 mt-3" type="submit">Lưu và thêm vào hóa đơn</button>
        <a th:href="@{/pos}" class="btn btn-outline-secondary w-100 mt-2">Bỏ qua</a>
    </form>
</main>
<nav th:replace="~{fragments/layout :: storeNav}"></nav>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
