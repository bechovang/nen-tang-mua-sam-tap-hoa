<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quét mã')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="store-wrap">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h4 mb-2">Quét mã vạch</h1>
    <p class="text-muted-2">Quét mã trên kệ. Nếu chưa có dữ liệu, nhập tên và giá rồi lưu.</p>

    <div class="row g-3">
        <div class="col-12 col-lg-6">
            <div id="scanner" class="scan-box"></div>
            <div class="d-flex gap-2 mt-2">
                <button type="button" id="startScan" class="btn btn-primary flex-grow-1">Bật camera</button>
                <button type="button" id="stopScan" class="btn btn-outline-secondary">Dừng</button>
            </div>
            <form id="scanLookupForm" th:action="@{/store/scan}" method="get" class="d-flex gap-2 mt-2">
                <input id="barcode" class="form-control" name="barcode" placeholder="Nhập mã tay" autocomplete="off">
                <button class="btn btn-outline-primary" type="submit">Tra mã</button>
            </form>
        </div>

        <div class="col-12 col-lg-6">
            <div th:if="${lookup != null}" class="card-soft mb-3">
                <div class="small-caps">Kết quả tra cứu</div>
                <div class="fw-semibold" th:text="${lookup.barcode}">Mã</div>
                <div th:text="${lookup.found() ? lookup.name() : 'Không tìm thấy tên. Nhập tay giúp tiệm.'}">Tên</div>
                <div class="small text-muted-2" th:text="${'Nguồn: ' + lookup.source()}">Nguồn</div>
                <div th:if="${existing != null}" class="alert alert-info mt-2 mb-0">Mã này đã có trong danh mục. Lưu sẽ cập nhật giá và tồn.</div>
            </div>

            <form th:action="@{/store/scan}" th:object="${productForm}" method="post"
                  enctype="multipart/form-data" class="card-soft">
                <div class="mb-2">
                    <label class="form-label" for="barcodeInput">Mã vạch</label>
                    <input class="form-control" id="barcodeInput" th:field="*{barcode}" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('barcode')}" th:errors="*{barcode}"></div>
                </div>
                <div class="mb-2">
                    <label class="form-label" for="nameInput">Tên món</label>
                    <input class="form-control" id="nameInput" th:field="*{name}" required>
                </div>
                <div class="row g-2">
                    <div class="col-6">
                        <label class="form-label" for="priceInput">Giá</label>
                        <input class="form-control" id="priceInput" type="number" min="1" th:field="*{price}" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label" for="unitInput">Đơn vị</label>
                        <input class="form-control" id="unitInput" th:field="*{unit}" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label" for="stockInput">Tồn kho</label>
                        <input class="form-control" id="stockInput" type="number" min="0" th:field="*{stock}">
                    </div>
                    <div class="col-6 d-flex align-items-end">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" th:field="*{active}" id="activeInput">
                            <label class="form-check-label" for="activeInput">Còn bán</label>
                        </div>
                    </div>
                </div>
                <div class="mb-2">
                    <label class="form-label" for="imageInput">Ảnh (tùy chọn, tối đa 2 MB)</label>
                    <input class="form-control" id="imageInput" type="file" name="image"
                           accept="image/jpeg,image/png,image/webp">
                    <div class="form-text">JPEG, PNG hoặc WebP. Ảnh lưu ở object storage.</div>
                </div>
                <button class="btn btn-primary w-100 mt-3" type="submit">Lưu món</button>
            </form>
        </div>
    </div>
</main>
<nav th:replace="~{fragments/layout :: storeNav}"></nav>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
    document.getElementById('startScan')?.addEventListener('click', () => {
        BarcodeScanner.start('scanner', code => {
            document.getElementById('barcode').value = code;
            document.getElementById('scanLookupForm').submit();
        });
    });
    document.getElementById('stopScan')?.addEventListener('click', () => BarcodeScanner.stop());
</script>
</body>
</html>
