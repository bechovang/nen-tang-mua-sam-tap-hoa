<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Thông báo')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="main-wrap">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Thông báo</h1>
        <form th:action="@{/notifications/read}" method="post">
            <button class="btn btn-sm btn-outline-secondary" type="submit">Đánh dấu đã đọc</button>
        </form>
    </div>

    <div th:if="${notifications.isEmpty()}" class="empty-state">
        <div class="icon">◌</div>
        <p>Chưa có thông báo nào.</p>
    </div>

    <div th:each="n : ${notifications}" class="card-soft mb-2" th:classappend="${n.read ? '' : 'border-primary'}">
        <div class="d-flex justify-content-between gap-2">
            <strong th:text="${n.title}">Tiêu đề</strong>
            <span class="small text-muted-2" th:text="${format.dateTime(n.createdAt)}">Thời gian</span>
        </div>
        <div class="small text-muted-2 mt-1" th:text="${n.body}">Nội dung</div>
    </div>
</main>
<nav th:replace="~{fragments/layout :: customerNav}"></nav>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
