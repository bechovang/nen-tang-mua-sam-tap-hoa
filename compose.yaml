services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: taphoa
      POSTGRES_USER: taphoa
      POSTGRES_PASSWORD: taphoa
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taphoa -d taphoa"]
      interval: 3s
      timeout: 3s
      retries: 20
  mail:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
  s3:
    image: adobe/s3mock:latest
    ports:
      - "9090:9090"
